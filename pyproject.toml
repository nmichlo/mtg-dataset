[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = []  # https://github.com/astral-sh/uv/issues/9513

[tool.setuptools.packages]
find = {}

[tool.setuptools_scm]
fallback_version = "0.0.0" # error

[project]
name = "mtgdata"
dynamic = ["version"]  # Version is managed by setuptools_scm
description = "MTG image dataset with automatic image scraping and conversion."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nathan Juraj Michlo", email = "NathanJMichlo@gmail.com" }]
urls = { Homepage = "https://github.com/nmichlo/mtg-dataset" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research"
]

dependencies = [
    # api iterator & image download
    "duckdb",
    "pytz",
    "requests",
    "doorway[extras]~=0.6.0",
    "pillow", # optional, but added to API
]


# extra dependencies
[project.optional-dependencies]

convert = [
    # dataset conversion
    "h5py",
    "numpy",
    "pillow",
    "tqdm",
    "torch",
]


# ========================================================================= #
# RUFF                                                                      #
# ========================================================================= #

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# `E4/E7/E9 + F` is the ruff default, `I` adds import sorting (previously isort).
# `TID251` enforces the banned-api list below.
# `B009`/`B010` ban `getattr(x, "const")` / `setattr(x, "const", v)` -- write `x.const`.
select = ["E4", "E7", "E9", "F", "I", "TID251", "B009", "B010"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any disables type checking wherever it appears. Use a precise type, a TypeVar, a Protocol, or a dedicated sentinel class."
"typing.cast".msg = "cast asserts a type the checker cannot verify. Narrow with isinstance/assert, or fix the annotation."

[tool.ruff.lint.isort]
# previously `isort --profile=black --force-single-line-imports`
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# `__init__.py` files are re-export hubs -- unsorted and "unused" imports are the point.
"**/__init__.py" = ["F401", "I001"]



# ========================================================================= #
# TY                                                                        #
# ========================================================================= #

# ty runs as a pre-commit hook and gates CI. it needs the dependencies resolvable
# and auto-detects `.venv`, so create one first:
#     uv venv --python 3.11 .venv && uv pip install --python .venv -e ".[convert]"
#     uvx ty check

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["data"]
