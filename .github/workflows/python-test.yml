name: test

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: ["main", "dev*", "feature*", "fix*"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # base deps only -- proves the package imports and works without the extras
      - name: Test defaults
        run: |
          uv pip install --system -e ".[test]"
          pytest --color=yes --verbose -m 'not extra_test'

      - name: Test extras
        run: |
          uv pip install --system -e ".[convert,raw,test]"
          pytest --color=yes --verbose
