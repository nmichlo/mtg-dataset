name: test

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: ["main", "dev*", "feature*", "fix*"]

jobs:
  # base deps only -- proves the package imports and works without the extras.
  # kept separate because under the full install these would always pass.
  defaults:
    uses: nmichlo/.github/.github/workflows/pytest.yaml@main
    with:
      python-versions: '["3.12", "3.13"]'
      install-extras: "test"
      pytest-args: "--color=yes --verbose -m 'not extra_test'"

  extras:
    uses: nmichlo/.github/.github/workflows/pytest.yaml@main
    with:
      python-versions: '["3.12", "3.13"]'
      install-extras: "convert,raw,test"
      pytest-args: "--color=yes --verbose"
